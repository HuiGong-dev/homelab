---
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-values
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |-
    sources:
      - ingress
      - traefik-proxy
    domainFilters:
      - home.hgpe.dev
    # Keep the legacy filter through the v0.22 upgrade. After v0.22 is healthy,
    # switch this to external-dns.kubernetes.io/enabled=true and remove the
    # external-dns.alpha.kubernetes.io/* annotations from managed resources.
    annotationFilter: external-dns.alpha.kubernetes.io/enabled=true
    registry: txt
    txtOwnerId: homelab-k3s
    policy: upsert-only

    provider: 
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.1.1
        service:
          port: 8888
        livenessProbe: 
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe: 
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-configuration
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-configuration
                key: user
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-configuration
                key: password
          - name: LOG_LEVEL
            value: debug
          - name: DRY_RUN
            value: "false"
