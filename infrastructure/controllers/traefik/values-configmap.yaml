---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-values
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |-
    api:
      dashboard: true

    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true

    ingressRoute:
      dashboard:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/hostname: traefik.home.hgpe.dev
          external-dns.alpha.kubernetes.io/target: 192.168.178.13,192.168.178.14
        entryPoints:
          - websecure
        matchRule: Host(`traefik.home.hgpe.dev`)
        tls: {}
