---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m0s
  releaseName: cert-manager
  targetNamespace: cert-manager
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
