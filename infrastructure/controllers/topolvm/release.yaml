---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: topolvm
  namespace: flux-system
spec:
  interval: 30m0s
  releaseName: topolvm
  targetNamespace: topolvm-system
  driftDetection:
    mode: enabled
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: topolvm
      version: 17.1.0
      sourceRef:
        kind: HelmRepository
        name: topolvm
        namespace: flux-system
      interval: 12h0m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: topolvm-values
      valuesKey: values.yaml
