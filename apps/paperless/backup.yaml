apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-export
  namespace: paperless
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-export
            app.kubernetes.io/part-of: paperless
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          initContainers:
            - name: wait-for-db
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z paperless-db-rw 5432; do echo waiting for postgres; sleep 2; done
            - name: wait-for-redis
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z redis 6379; do echo waiting for redis; sleep 2; done
          containers:
            - name: exporter
              image: paperless-ngx
              imagePullPolicy: IfNotPresent
              args:
                - document_exporter
                - --delete
                - /usr/src/paperless/export/current
              env:
                - name: PAPERLESS_REDIS
                  value: redis://redis:6379
                - name: PAPERLESS_DBHOST
                  value: paperless-db-rw
                - name: PAPERLESS_DBENGINE
                  value: postgresql
                - name: PAPERLESS_DBNAME
                  value: paperless
                - name: PAPERLESS_URL
                  value: https://paperless.home.hgpe.dev
                - name: PAPERLESS_TIME_ZONE
                  value: Europe/Berlin
                - name: PAPERLESS_OCR_LANGUAGE
                  value: deu+eng+chi_sim
                - name: PAPERLESS_OCR_LANGUAGES
                  value: chi-sim
                - name: PAPERLESS_TIKA_ENABLED
                  value: "true"
                - name: PAPERLESS_TIKA_ENDPOINT
                  value: http://tika:9998
                - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
                  value: http://gotenberg:3000
                - name: USERMAP_UID
                  value: "1000"
                - name: USERMAP_GID
                  value: "1000"
              envFrom:
                - secretRef:
                    name: paperless-secret
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /usr/src/paperless/data
                - name: media
                  mountPath: /usr/src/paperless/media
                - name: export
                  mountPath: /usr/src/paperless/export
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
            - name: export
              persistentVolumeClaim:
                claimName: paperless-export
