apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: topolvm-local-rwo
  resources:
    requests:
      storage: 2Gi
