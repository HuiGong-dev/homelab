apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
spec:
  affinity:
    nodeSelector:
      kubernetes.io/hostname: k3s-server-01
  instances: 1
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-app
