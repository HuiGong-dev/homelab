---
apiVersion: v1
kind: Service
metadata:
  name: pve
  namespace: networking
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve
  namespace: networking
  labels:
    kubernetes.io/service-name: pve
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8006
endpoints:
  - addresses:
      - 192.168.178.10
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: networking
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve
  namespace: networking
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: pve.home.hgpe.dev
    external-dns.alpha.kubernetes.io/target: 192.168.178.13,192.168.178.14
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pve.home.hgpe.dev`)
      kind: Rule
      services:
        - name: pve
          port: 8006
          scheme: https
          serversTransport: pve-transport
  tls: {}
