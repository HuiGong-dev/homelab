---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: networking
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant
  namespace: networking
  labels:
    kubernetes.io/service-name: homeassistant
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 192.168.178.15
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: networking
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: homeassistant.home.hgpe.dev
    external-dns.alpha.kubernetes.io/target: 192.168.178.13,192.168.178.14
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homeassistant.home.hgpe.dev`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
          scheme: http
  tls: {}
