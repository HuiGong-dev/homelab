---
apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: networking
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard
  namespace: networking
  labels:
    kubernetes.io/service-name: adguard
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 192.168.178.12
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard
  namespace: networking
  annotations:
    external-dns.alpha.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/hostname: adguard.home.hgpe.dev
    external-dns.alpha.kubernetes.io/target: 192.168.178.13,192.168.178.14
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.home.hgpe.dev`)
      kind: Rule
      services:
        - name: adguard
          port: 80
          scheme: http
  tls: {}
