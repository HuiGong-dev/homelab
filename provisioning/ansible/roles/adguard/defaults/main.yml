---
adguard_version: latest
adguard_arch: amd64
adguard_install_dir: /opt/AdGuardHome
adguard_archive_path: /tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz

adguard_bind_host: 0.0.0.0
adguard_web_port: 80
adguard_dns_port: 53

adguard_web_username: admin
adguard_web_password_hash: ""
adguard_language: en
adguard_http_session_ttl: 30d

adguard_upstream_dns:
  - https://dns10.quad9.net/dns-query

adguard_bootstrap_dns:
  - 9.9.9.10
  - 149.112.112.10
  - 2620:fe::10
  - 2620:fe::fe:10

adguard_filter_update_interval: 24
adguard_querylog_interval: 90d
adguard_stats_interval: 1d
adguard_upstream_mode: load_balance
adguard_fastest_timeout: 1s
adguard_upstream_timeout: 10s
adguard_cache_optimistic_answer_ttl: 30s
adguard_cache_optimistic_max_age: 12h

adguard_filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2

adguard_rewrites:
  - domain: pve.home.hgpe.dev
    answer: 192.168.178.11
    enabled: true
  - domain: paperless.home.hgpe.dev
    answer: 192.168.178.11
    enabled: true
  - domain: adguard.home.hgpe.dev
    answer: 192.168.178.11
    enabled: true
  - domain: "*.home.hgpe.dev"
    answer: 192.168.178.11
    enabled: true
