---
- name: Test SOPS vars loading
  hosts: all
  gather_facts: false
  tasks:
    - name: Confirm SOPS secrets are loaded from inventory
      ansible.builtin.assert:
        that:
          - tailscale_auth_key is defined
          - tailscale_auth_key | length > 0
          - k3s_token is defined
          - k3s_token | length > 0
        success_msg: SOPS secrets are loaded from inventory
        fail_msg: >-
          SOPS secrets were not loaded. Check the community.sops collection,
          age key access, and inventories/homelab/group_vars/all.sops.yml.
      no_log: true
