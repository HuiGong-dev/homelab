---
- name: Install Tailscale apt prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Install Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Install Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} main
    filename: tailscale
    state: present
    update_cache: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Enable IPv4 forwarding for subnet routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  when: tailscale_advertise_routes | length > 0

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-tailscale.conf
  changed_when: false
  when: tailscale_advertise_routes | length > 0

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Record Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ (tailscale_status.stdout | from_json).BackendState | default('') }}"
  when:
    - tailscale_status.rc == 0
    - tailscale_status.stdout | length > 0

- name: Build Tailscale up command
  ansible.builtin.set_fact:
    tailscale_up_argv: >-
      {{
        [
          'tailscale',
          'up',
          '--hostname=' ~ tailscale_hostname,
          '--accept-dns=' ~ (tailscale_accept_dns | string | lower),
          '--accept-routes=' ~ (tailscale_accept_routes | string | lower)
        ]
        + (
          ['--auth-key=' ~ tailscale_auth_key]
          if tailscale_auth_key is defined and tailscale_auth_key | length > 0
          else []
        )
        + (
          ['--advertise-routes=' ~ (tailscale_advertise_routes | join(','))]
          if tailscale_advertise_routes | length > 0
          else []
        )
        + (['--advertise-exit-node'] if tailscale_advertise_exit_node else [])
      }}

- name: Configure Tailscale when authenticated
  ansible.builtin.command:
    argv: "{{ tailscale_up_argv }}"
  no_log: true
  when:
    - >
      (tailscale_auth_key is defined and tailscale_auth_key | length > 0)
      or (tailscale_backend_state | default('') == 'Running')
