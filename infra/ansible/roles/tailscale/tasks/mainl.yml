---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Check if Tailscale is already installed
  ansible.builtin.command: command -v tailscale
  register: tailscale_installed
  changed_when: false
  failed_when: false

- name: Install Tailscale
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    executable: /bin/bash
  become: true
  when: tailscale_installed.rc != 0

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true

- name: Enable IPv4 forwarding for subnet routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  become: true
  when: tailscale_advertise_routes | length > 0

- name: Apply sysctl settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
  become: true
  changed_when: false
  when: tailscale_advertise_routes | length > 0

- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  become: true

- name: Bring Tailscale up
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ tailscale_hostname }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    {% if tailscale_advertise_routes | length > 0 %}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    {% endif %}
    {% if tailscale_advertise_exit_node %}
    --advertise-exit-node
    {% endif %}
  become: true
  no_log: true
  when:
    - tailscale_auth_key is defined
    - tailscale_status.rc != 0 or '"BackendState":"Running"' not in tailscale_status.stdout