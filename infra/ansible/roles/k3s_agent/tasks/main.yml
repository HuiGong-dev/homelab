---
- name: Validate k3s agent variables
  ansible.builtin.assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
      - k3s_channel is defined
      - k3s_channel | length > 0
      - k3s_node_ip is defined
      - k3s_node_ip | length > 0
      - k3s_config_path is defined
      - k3s_config_path | length > 0
      - k3s_install_script_path is defined
      - k3s_install_script_path | length > 0
      - k3s_server_host is defined
      - k3s_server_host | length > 0
      - k3s_server_url is defined
      - k3s_server_url | length > 0
    fail_msg: >-
      Required k3s agent variables are missing. Set k3s_token with -e
      and ensure the k3s_agent role defaults are loaded.
  no_log: true

- name: Check whether k3s agent is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service_file

- name: Install k3s agent prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: not k3s_agent_service_file.stat.exists

- name: Wait for k3s server API
  ansible.builtin.wait_for:
    host: "{{ hostvars[k3s_server_host].ansible_host }}"
    port: 6443
    timeout: 300
  when: not k3s_agent_service_file.stat.exists

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install k3s agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s-agent
  no_log: true

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: not k3s_agent_service_file.stat.exists

- name: Install k3s agent
  ansible.builtin.command:
    cmd: "{{ k3s_install_script_path }}"
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: agent
  when: not k3s_agent_service_file.stat.exists
  changed_when: true

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Flush k3s-agent restart before service checks
  ansible.builtin.meta: flush_handlers

- name: Verify k3s-agent service is active
  ansible.builtin.command:
    cmd: systemctl is-active k3s-agent
  changed_when: false
